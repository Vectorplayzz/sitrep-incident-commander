# The SITREP victim stack: a small e-commerce backend that is about to
# have a bad day, plus the MCP server the agent uses to investigate it.
#
#   docker compose up -d      bring the stack up (healthy baseline)
#   make incident             ship the bad deploy
#   make status               see what is on fire

name: sitrep

services:
  inventory-api:
    build:
      context: ./services
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8000 --app-dir /app/inventory-api
    environment:
      SITREP_DB: /data/telemetry.db
      INVENTORY_LATENCY_MS: "28"
    volumes:
      - telemetry-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx;httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 5s
      timeout: 3s
      retries: 10

  checkout-api:
    build:
      context: ./services
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8000 --app-dir /app/checkout-api
    environment:
      SITREP_DB: /data/telemetry.db
      INVENTORY_URL: http://inventory-api:8000
    volumes:
      - telemetry-data:/data
    ports:
      - "8801:8000"
    depends_on:
      inventory-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx;httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The shop a customer actually sees. This is where an outage stops being a
  # metric and becomes an order that will not go through.
  storefront:
    build:
      context: ./services
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8000 --app-dir /app/storefront
    environment:
      SITREP_DB: /data/telemetry.db
      CHECKOUT_URL: http://checkout-api:8000
    volumes:
      - telemetry-data:/data
    ports:
      - "8099:8000"
    depends_on:
      checkout-api:
        condition: service_healthy

  loadgen:
    build:
      context: ./services
    command: python -m loadgen.main
    environment:
      SITREP_DB: /data/telemetry.db
      CHECKOUT_URL: http://checkout-api:8000
      LOADGEN_RPS: "6"
      LOADGEN_CONCURRENCY: "12"
    volumes:
      - telemetry-data:/data
    depends_on:
      checkout-api:
        condition: service_healthy

  # The agent harness itself. Containerised because TrueForge v0.1.4 cannot
  # start on Windows (ESM loader rejects the bare drive-letter path), and
  # because running it here puts it on the same network as the MCP server.
  # UI at http://localhost:8790
  trueforge:
    build:
      context: ./trueforge
    environment:
      # Defaults to localhost, which inside a container means the published
      # port reaches nothing. Must bind all interfaces.
      HOST: 0.0.0.0
      PORT: "8790"
    ports:
      - "8790:8790"
    volumes:
      - trueforge-state:/root/.local/share
    depends_on:
      mcp-server:
        condition: service_started
    restart: unless-stopped

  # The interface SITREP investigates through. TrueForge connects to remote
  # HTTP MCP servers, so this is a long-lived service rather than a stdio
  # subprocess. Register it in TrueForge as http://localhost:8931/mcp
  mcp-server:
    build:
      context: ./mcp-server
    environment:
      SITREP_DB: /data/telemetry.db
      SITREP_MCP_HOST: 0.0.0.0
      SITREP_MCP_PORT: "8931"
    volumes:
      - telemetry-data:/data
    ports:
      - "8931:8931"
    depends_on:
      checkout-api:
        condition: service_healthy

volumes:
  trueforge-state:
  # A named volume, not a bind mount. See services/common/telemetry.py.
  telemetry-data:
